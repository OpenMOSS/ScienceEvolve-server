[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drugevolve"
version = "0.1.0"
description = "Evaluator-driven agentic evolution for drug-discovery algorithms"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "DrugEvolve contributors"}]
keywords = ["agentic-ai", "drug-discovery", "optimization", "evolution"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
agents = [
  "json5>=0.9",
  "openai>=1.0",
  "openai-agents>=0.2",
  "pydantic>=2.0",
  "python-patch>=0.0.1",
]
dev = ["build>=1.2", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
drugevolve = "drugevolve.cli:main"

[tool.setuptools.packages.find]
include = ["drugevolve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
